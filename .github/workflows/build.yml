name: Build and Release Cort1so1 IPA

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          fi
          xcodebuild -version

      - name: Build Xcode Project
        run: |
          set -o pipefail
          xcodebuild build \
            -project Cort1so1.xcodeproj \
            -scheme Cort1so1 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee xcodebuild.log

      - name: Print full log on failure
        if: failure()
        run: |
          echo "==================== FULL XCODEBUILD LOG ===================="
          cat xcodebuild.log

      - name: Upload build log artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Cort1so1.app Payload/
          zip -vr Cort1so1.ipa Payload
          ls -la Cort1so1.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cort1so1-ipa
          path: Cort1so1.ipa
          retention-days: 30

      - name: Create or Replace GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Cort1so1 v1.3' }}
          make_latest: true
          body: |
            ### Cort1so1 Release v1.3

            Cort1so1 - iOS Jailbreak, Substrate Tweak Engine, Cortisol Terminal & Custom Status Bar Simulator.

            #### What's New in v1.3:
            - Removed 100% battery percentage limit (supports 1,000,000% and any custom values).
            - Interactive percentage and accent color configuration directly from the UI (tap rows in Terminal tab).
            - Fast battery override commands in Terminal: `setbattery 1000000`, `battery percentage set 1000000`, `battery color set orange`, `battery reset`.
            - Pixel-perfect native iOS Status Bar overlay with compact 24.5pt battery icon, dynamic pill expansion, and text inversion.
            - Cortisol Terminal tab with interactive command input, quick chips, and log output.

            #### Installation Instructions:
            1. Download the Cort1so1.ipa file from the Assets section below.
            2. Sideload using TrollStore (recommended), AltStore, SideStore, or Sideloadly.
          files: Cort1so1.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
