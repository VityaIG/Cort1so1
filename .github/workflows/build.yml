name: Build and Release Cort1so1 IPA

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -p
          xcodebuild -version

      - name: Build Xcode Project
        run: |
          set -o pipefail
          xcodebuild build \
            -project Cort1so1.xcodeproj \
            -scheme Cort1so1 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee xcodebuild.log

      - name: Print errors and upload build log on failure
        if: failure()
        run: |
          echo "==================== BUILD FAILED: XCODEBUILD LOG ERRORS ===================="
          grep -E "error:|fatal error:|BUILD FAILED" xcodebuild.log || tail -n 100 xcodebuild.log

      - name: Upload build log artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Cort1so1.app Payload/
          zip -vr Cort1so1.ipa Payload
          ls -la Cort1so1.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cort1so1-ipa
          path: Cort1so1.ipa
          retention-days: 30

      - name: Create or Replace GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Cort1so1 v1.2' }}
          body: |
            Official build of Cort1so1 (iOS HIG Native) v1.2.
            
            Features and updates in v1.2:
            - Fully translated the app and GitHub repository into English as the primary language!
            - Updated Tweak names to humorous equivalents ("Download More RAM", "Tinfoil Hat Pro", "Microwave Charging", etc.)
            - Added the ability to manage custom tweaks via a dedicated "Manage Tweaks" menu accessible from the top-left button on the Tweaks screen.
            - Fixed custom tweak swipe-to-delete behavior.
            - Integrated real WebKit-based SpringBoard respring engine.
            - Clean and strict adherence to Apple Human Interface Guidelines.
            
            Installation Instructions:
            1. Download the Cort1so1.ipa file from the Assets section below.
            2. Install the app via TrollStore, AltStore, SideStore, or Sideloadly.
          files: Cort1so1.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
