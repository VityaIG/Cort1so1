name: Build and Release Cort1so1 IPA

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -p
          xcodebuild -version

      - name: Build Xcode Project
        run: |
          set -o pipefail
          xcodebuild build \
            -project Cort1so1.xcodeproj \
            -scheme Cort1so1 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee xcodebuild.log

      - name: Print full log on failure
        if: failure()
        run: |
          echo "==================== FULL XCODEBUILD LOG ===================="
          cat xcodebuild.log

      - name: Upload build log artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Cort1so1.app Payload/
          zip -vr Cort1so1.ipa Payload
          ls -la Cort1so1.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cort1so1-ipa
          path: Cort1so1.ipa
          retention-days: 30

      - name: Create or Replace GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Cort1so1 v1.2' }}
          body: |
            ### Cort1so1 Release v1.2

            **Cort1so1** is an advanced iOS Jailbreak, Substrate Tweak Engine & Downgrade Environment Simulator built strictly with SwiftUI and Apple Human Interface Guidelines (HIG).

            #### What's New in v1.2:
            - **Dynamic Tweaks Tab**: The "Tweaks" tab is unlocked and visible only after completing the jailbreak sequence, automatically updating across the interface.
            - **Custom Post-Apply Pop-up System**:
              - Added custom pop-up title (`"son"` / `"Запустил"`) and button (`"bruh"` / `"Семя в арбуууз"`).
              - Added editable post-apply title and button text directly within the "New Tweak" & "Edit Tweak" sheets.
              - Added interactive "Test Apply Pop-up" and one-tap "Save & Apply" actions.
              - Streamlined Tweaks page with a single, clean top "Apply" action button.
            - **First-Launch Onboarding & Headphone Safety Warning**:
              - Sequential native modal dialogs on first launch introducing app capabilities and warning about loud audio playback.
            - **Humorous & Overclock Tweaks**:
              - Added 3 new humorous tweaks to all categories ("Full Invisibility Cloak", "Kinetic Drop Forcefield", "Universal Luck Boost +999%", etc.).
            - **Performance, Audio & Memory Polish**:
              - Removed unnecessary vibrations/haptics, preserving them for emergency alerts only.
              - Eliminated memory leaks in native respring `posix_spawn` routines.
              - Enhanced `AVPlayer` notification observer lifecycle management.
              - Fully updated bilingual English & Russian localization support.

            #### Installation Instructions:
            1. Download the `Cort1so1.ipa` file from the **Assets** section below.
            2. Sideload the application using **TrollStore** (recommended), **AltStore**, **SideStore**, or **Sideloadly**.
          files: Cort1so1.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
